<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: transparent;
                overflow: hidden;
                font-family: -apple-system, BlinkMacSystemFont, sans-serif;
                -webkit-font-smoothing: antialiased;
                user-select: none;
            }

            body {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            /* Même pilule que celle de la correction (overlay.html) */
            .pill {
                display: flex;
                align-items: center;
                gap: 9px;
                height: 34px;
                padding: 0 14px;
                box-sizing: border-box;
                border-radius: 17px;
                background: rgba(18, 18, 18, 0.92);
                border: 1px solid rgba(255, 255, 255, 0.14);
                color: rgba(255, 255, 255, 0.9);
                font-size: 12px;
                opacity: 0;
                transform: translateY(8px) scale(0.9);
                transition: opacity 0.18s ease, transform 0.18s ease;
            }

            body.visible .pill {
                opacity: 1;
                transform: none;
            }

            body.recording .pill {
                padding-right: 8px;
            }

            .dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #ef4444;
                animation: pulse 1.6s ease-in-out infinite;
            }

            @keyframes pulse {
                50% {
                    opacity: 0.35;
                }
            }

            .timer {
                font-family: "SF Mono", Menlo, monospace;
                font-variant-numeric: tabular-nums;
            }

            .bars {
                display: flex;
                align-items: center;
                gap: 2px;
                height: 14px;
            }

            .bars i {
                width: 2px;
                height: 14px;
                border-radius: 1px;
                background: rgba(255, 255, 255, 0.9);
                transform: scaleY(0.15);
                transition: transform 0.1s linear;
            }

            /* Pendant la transcription, les barres ondulent toutes seules */
            body.processing .bars i {
                animation: wave 0.9s ease-in-out infinite;
            }

            body.processing .bars i:nth-child(2) {
                animation-delay: 0.15s;
            }

            body.processing .bars i:nth-child(3) {
                animation-delay: 0.3s;
            }

            body.processing .bars i:nth-child(4) {
                animation-delay: 0.45s;
            }

            @keyframes wave {
                0%,
                100% {
                    transform: scaleY(0.35);
                }
                50% {
                    transform: scaleY(1);
                }
            }

            .stop {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 20px;
                height: 20px;
                padding: 0;
                border: 0;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.14);
                cursor: pointer;
            }

            .stop:hover {
                background: rgba(255, 255, 255, 0.26);
            }

            .stop::after {
                content: "";
                width: 7px;
                height: 7px;
                border-radius: 1.5px;
                background: rgba(255, 255, 255, 0.9);
            }

            .icon {
                width: 15px;
                height: 15px;
            }

            .ok {
                color: #4ade80;
            }

            .err {
                color: #f87171;
            }

            /* Chaque état n'affiche que ses éléments */
            .pill > * {
                display: none;
            }

            body.recording :is(.dot, .timer, .bars, .stop),
            body.processing :is(.bars, .processing-label),
            body.done :is(.ok, .done-label),
            body.error :is(.err, .error-label) {
                display: flex;
            }
        </style>
    </head>
    <body>
        <div class="pill">
            <span class="dot"></span>
            <span class="timer">0:00</span>
            <span class="bars"><i></i><i></i><i></i><i></i></span>
            <button class="stop" title="Arrêter l'enregistrement"></button>
            <span class="processing-label">Transcription…</span>
            <svg class="icon ok" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 8.5l3.2 3L13 4.5" />
            </svg>
            <span class="done-label">Transcription prête</span>
            <svg class="icon err" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <path d="M4 4l8 8M12 4l-8 8" />
            </svg>
            <span class="error-label">Échec, voir Réunions</span>
        </div>
        <script>
            const timer = document.querySelector(".timer");
            const bars = [...document.querySelectorAll(".bars i")];
            // Les barres de gauche suivent le micro, celles de droite le son des autres
            const BAR_SOURCES = ["mic", "mic", "system", "system"];
            const BAR_SCALES = [0.7, 1, 1, 0.7];
            let state = "hidden";
            let startedAt = null;

            function formatElapsed(ms) {
                const total = Math.floor(ms / 1000);
                const minutes = Math.floor(total / 60);
                const seconds = String(total % 60).padStart(2, "0");
                return minutes >= 60 ? `${Math.floor(minutes / 60)}:${String(minutes % 60).padStart(2, "0")}:${seconds}` : `${minutes}:${seconds}`;
            }

            setInterval(() => {
                if (state === "recording" && startedAt) timer.textContent = formatElapsed(Date.now() - startedAt);
            }, 250);

            window.indicator.onState((update) => {
                state = update.state;
                startedAt = update.startedAt ?? startedAt;
                document.body.className = state === "hidden" ? "" : `visible ${state}`;
                bars.forEach((bar) => (bar.style.transform = ""));
                if (state === "recording" && startedAt) timer.textContent = formatElapsed(Date.now() - startedAt);
            });

            window.indicator.onLevels((levels) => {
                bars.forEach((bar, i) => {
                    bar.style.transform = `scaleY(${Math.max(0.15, levels[BAR_SOURCES[i]] * BAR_SCALES[i])})`;
                });
            });

            document.querySelector(".stop").addEventListener("click", () => window.indicator.stop());
            document.querySelector(".pill").addEventListener("contextmenu", (e) => {
                e.preventDefault();
                if (state === "recording") window.indicator.openMenu();
            });
        </script>
    </body>
</html>
